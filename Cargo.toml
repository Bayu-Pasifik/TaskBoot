[package]
name = "taskboot"
version = "0.1.0"
edition = "2021"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_System_Registry", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Security",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
